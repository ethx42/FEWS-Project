service: fleet-warning-system
frameworkVersion: '4' # Current stable Serverless Framework version (4.23.0)

provider:
  name: aws
  runtime: nodejs22.x # Current LTS for AWS Lambda (Nov 2025)
  region: us-east-1  
  stage: ${opt:stage, 'prod'}
  
  environment:
    SQS_QUEUE_URL: { Ref: FleetEventsQueue }
    ALERT_RECIPIENT: ${env:ALERT_RECIPIENT}
    SENDER_EMAIL: ${env:SENDER_EMAIL}
    LOG_LEVEL: ${env:LOG_LEVEL, 'INFO'}
  
  iam:
    role:
      statements:
        # Ingest Lambda: Send messages to SQS
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - Fn::GetAtt: [ FleetEventsQueue, Arn ]
        
        # Worker Lambda: Receive and delete messages from SQS
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - Fn::GetAtt: [ FleetEventsQueue, Arn ]
        
        # Worker Lambda: Send emails via SES
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'

apiGateway:
  apiKeys:
    - name: fleet-api-key-${sls:stage}
      description: API key for fleet telemetry ingestion
  usagePlan:
    throttle:
      rateLimit: 15        # Constraint: 15 RPS Rate
      burstLimit: 2000     # Constraint: 2000 Burst

functions:
  # 1. Lambda: Ingest (Fast ingestion with validation)
  ingest:
    handler: src/handlers/ingest.handler
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: event
          method: post
          private: true 

  # 2. Lambda: Worker (Async processing with partial batch failure support)
  worker:
    handler: src/handlers/worker.handler
    timeout: 60  # Increased for email send retries
    memorySize: 256
    reservedConcurrency: 5 # Max 5 concurrent executions
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ FleetEventsQueue, Arn ]
          batchSize: 10
          functionResponseType: ReportBatchItemFailures  # Enable partial batch failure

resources:
  Resources:
    # Main SQS Queue
    FleetEventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: fleet-events-queue-${sls:stage}
        VisibilityTimeout: 360  # 6x Lambda timeout (60s * 6 = 360s)
        MessageRetentionPeriod: 345600  # 4 days
        ReceiveMessageWaitTimeSeconds: 20  # Enable long polling
        SqsManagedSseEnabled: true  # Enable encryption at rest
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [ FleetEventsDLQ, Arn ]
          maxReceiveCount: 5  # Retry 5 times before moving to DLQ
    
    # Dead Letter Queue
    FleetEventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: fleet-events-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600  # 14 days
        SqsManagedSseEnabled: true
    
    # CloudWatch Alarm: DLQ has messages (indicates failures)
    DLQAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: fleet-events-dlq-alarm-${sls:stage}
        AlarmDescription: Alert when messages appear in DLQ
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Statistic: Sum
        Period: 300  # 5 minutes
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Name: QueueName
            Value:
              Fn::GetAtt: [ FleetEventsDLQ, QueueName ]
    
    # CloudWatch Alarm: Queue age is too high
    QueueAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: fleet-events-queue-age-alarm-${sls:stage}
        AlarmDescription: Alert when messages are too old in queue
        MetricName: ApproximateAgeOfOldestMessage
        Namespace: AWS/SQS
        Statistic: Maximum
        Period: 300  # 5 minutes
        EvaluationPeriods: 1
        Threshold: 600  # 10 minutes
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: QueueName
            Value:
              Fn::GetAtt: [ FleetEventsQueue, QueueName ]

  Outputs:
    ApiEndpoint:
      Description: API Gateway endpoint URL
      Value:
        Fn::Sub: https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}/event
    
    QueueUrl:
      Description: SQS Queue URL
      Value:
        Ref: FleetEventsQueue
    
    DLQUrl:
      Description: Dead Letter Queue URL
      Value:
        Ref: FleetEventsDLQ
