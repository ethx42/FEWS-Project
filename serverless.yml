service: fleet-warning-system
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'prod'}

  apiGateway:
    apiKeys:
      - name: fleet-api-key-${sls:stage}
        description: API key for fleet telemetry ingestion
    usagePlan:
      throttle:
        rateLimit: 15
        burstLimit: 2000

  environment:
    SQS_QUEUE_URL: { Ref: FleetEventsQueue }
    ALERT_RECIPIENT: ${env:ALERT_RECIPIENT}
    SENDER_EMAIL: ${env:SENDER_EMAIL}
    LOG_LEVEL: ${env:LOG_LEVEL, 'INFO'}

  iam:
    role:
      name: fleet-warning-system-lambda-role-${sls:stage}
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - Fn::GetAtt: [FleetEventsQueue, Arn]

        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - Fn::GetAtt: [FleetEventsQueue, Arn]

        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"

        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/*:*"

functions:
  ingest:
    handler: src/handlers/ingest.handler
    timeout: 10
    memorySize: 256
    events:
      - http:
          path: event
          method: post
          private: true

  worker:
    handler: src/handlers/worker.handler
    timeout: 60
    memorySize: 256
    events:
      - sqs:
          arn:
            Fn::GetAtt: [FleetEventsQueue, Arn]
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:

    FleetEventsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: fleet-events-queue-${sls:stage}
        VisibilityTimeout: 360
        MessageRetentionPeriod: 345600
        ReceiveMessageWaitTimeSeconds: 20
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [FleetEventsDLQ, Arn]
          maxReceiveCount: 5

    FleetEventsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: fleet-events-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    DLQAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: fleet-events-dlq-alarm-${sls:stage}
        AlarmDescription: Alert when messages appear in DLQ
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Name: QueueName
            Value:
              Fn::GetAtt: [FleetEventsDLQ, QueueName]

    QueueAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: fleet-events-queue-age-alarm-${sls:stage}
        AlarmDescription: Alert when messages are too old in queue
        MetricName: ApproximateAgeOfOldestMessage
        Namespace: AWS/SQS
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 600
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: QueueName
            Value:
              Fn::GetAtt: [FleetEventsQueue, QueueName]

  Outputs:
    QueueUrl:
      Description: SQS Queue URL
      Value:
        Ref: FleetEventsQueue

    DLQUrl:
      Description: Dead Letter Queue URL
      Value:
        Ref: FleetEventsDLQ
